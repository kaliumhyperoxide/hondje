<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jack op Avontuur</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10121c;
    color: #e8e4ff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  #stage { position: relative; line-height: 0; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #2b2f45;
    border-radius: 4px;
    box-shadow: 0 0 0 2px #10121c, 0 12px 40px rgba(0,0,0,.6);
    background: #7ec0ee;
  }
  #hint {
    font-size: 12px; letter-spacing: .5px; color: #8d93b5;
    text-align: center; padding: 0 12px;
  }
  #hint b { color: #ffd7e4; }

  /* Touch controls (mobiel) */
  #touch {
    display: none;
    position: fixed; inset: auto 0 0 0;
    padding: 12px; justify-content: space-between;
    pointer-events: none;
  }
  #touch .side { display: flex; gap: 12px; pointer-events: auto; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid #4a5178; background: rgba(30,34,54,.75);
    color: #e8e4ff; font-size: 26px; font-family: inherit;
    touch-action: none;
  }
  #touch button:active { background: rgba(90,100,150,.9); }
  body.touch #touch { display: flex; }
  body.touch #hint { display: none; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="384" height="224"></canvas>
    </div>
    <div id="hint">
      <b>&larr; &rarr;</b> of <b>A / D</b> lopen &nbsp;&middot;&nbsp;
      <b>Spatie</b> / <b>&uarr;</b> / <b>W</b> springen &nbsp;&middot;&nbsp;
      <b>P</b> pauze &nbsp;&middot;&nbsp; <b>M</b> geluid &nbsp;&middot;&nbsp; <b>R</b> opnieuw
    </div>
  </div>

  <div id="touch">
    <div class="side">
      <button id="btn-left" aria-label="links">&#9664;</button>
      <button id="btn-right" aria-label="rechts">&#9654;</button>
    </div>
    <div class="side">
      <button id="btn-jump" aria-label="springen">&#9650;</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
